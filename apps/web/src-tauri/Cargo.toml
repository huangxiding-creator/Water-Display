[package]
name = "water-display"
version = "0.1.0"
description = "江巷灌区数字孪生平台 — 展示平台桌面版"
authors = ["huangxiding-creator"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "water_display_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
